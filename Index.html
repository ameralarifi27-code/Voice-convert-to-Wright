<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التفريغ الصوتي الذكي (Gemini Flash)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" async></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --bg-color: #f3f4f6; --card-bg: #ffffff; --text-dark: #1f2937; --border: #e5e7eb; --success: #10b981; --error: #ef4444; }
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 850px; background: var(--card-bg); padding: 20px; border-radius: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        input[type="file"], input[type="text"], select { width: 100%; padding: 10px; border: 2px solid var(--border); border-radius: 8px; font-size: 13px; background: #f9fafb; outline: none; margin-bottom: 8px; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h3>الكود الأول (اتصال مباشر بالمتصفح)</h3>
        <p>هذا الكود كان يطلب إدخال مفتاح الـ API في الواجهة ويرسل الصوت مباشرة لنموذج جوجل.</p>
    </div>
</body>
</html>
