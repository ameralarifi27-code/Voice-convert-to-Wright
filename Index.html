<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التفريغ الصوتي الاحترافية</title>
    <!-- مكتبة jsPDF لتصدير ملفات PDF بكل احترافية وبدون أخطاء -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 10px 0;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--text-dark);
        }

        input[type="file"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
            background: #f9fafb;
        }

        input[type="file"]:focus, select:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .progress-container {
            display: none;
            margin-top: 20px;
            background: #f3f4f6;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid var(--border);
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #e5e7eb;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-dark);
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            display: none;
        }

        .msg-success { background: #d1fae5; color: var(--success); }
        .msg-error { background: #fee2e2; color: var(--error); }

        .files-list {
            margin-top: 30px;
            border-top: 2px solid var(--border);
            padding-top: 20px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .file-info {
            flex: 1;
            min-width: 200px;
        }

        .file-name {
            font-weight: bold;
            color: var(--primary);
            word-break: break-all;
        }

        .file-meta {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 5px;
        }

        .file-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 13px;
            width: auto;
        }

        .btn-green { background: var(--success); }
        .btn-green:hover { background: #059669; }

        .transcription-result {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            white-space: pre-wrap;
            line-height: 1.8;
            font-size: 16px;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎙️ منصة التفريغ الصوتي</h1>
        <p style="color: var(--text-light); margin: 0;">سرعة، دقة، واحترافية بالذكاء الاصطناعي</p>
    </div>

    <div class="container">
        <div class="form-group">
            <label>اختر الملف الصوتي:</label>
            <input type="file" id="audioFile" accept="audio/*">
        </div>

        <button onclick="uploadFile()">بدء رفع الملف ⬆️</button>

        <div class="progress-container" id="progressContainer">
            <div class="progress-text">
                <span id="uploadStatus">جاري الرفع...</span>
                <span id="uploadPercentage">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div style="text-align: left; font-size: 12px; margin-top: 5px; color: var(--text-light);" id="uploadMBs">0 MB / 0 MB</div>
        </div>

        <div id="uploadMessage" class="message"></div>

        <div class="files-list" id="filesListContainer">
            <h3 style="margin-top: 0; color: var(--text-dark);">📁 الملفات الجاهزة للتفريغ:</h3>
            <div id="filesList">
                <p style="text-align: center; color: var(--text-light); font-size: 14px;">جاري تحميل القائمة...</p>
            </div>
        </div>
        
        <div id="transcriptionResult" class="transcription-result"></div>
    </div>

    <script>
        const SERVER_URL = 'https://responsible-strength-production-4f5d.up.railway.app';

        window.onload = loadFiles;

        function showMessage(elementId, text, isSuccess) {
            const el = document.getElementById(elementId);
            el.innerText = text;
            el.className = 'message ' + (isSuccess ? 'msg-success' : 'msg-error');
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 6000);
        }

        function uploadFile() {
            const fileInput = document.getElementById('audioFile');
            if (fileInput.files.length === 0) {
                alert('الرجاء اختيار ملف أولاً.');
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('audioFile', file);

            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            const uploadPercentage = document.getElementById('uploadPercentage');
            const uploadMBs = document.getElementById('uploadMBs');
            const uploadStatus = document.getElementById('uploadStatus');

            progressContainer.style.display = 'block';
            progressFill.style.width = '0%';
            uploadPercentage.innerText = '0%';
            uploadStatus.innerText = 'جاري الرفع...';

            const xhr = new XMLHttpRequest();
            xhr.open('POST', `${SERVER_URL}/api/upload`, true);

            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const percentComplete = Math.round((e.loaded / e.total) * 100);
                    const loadedMB = (e.loaded / (1024 * 1024)).toFixed(2);
                    const totalMB = (e.total / (1024 * 1024)).toFixed(2);

                    progressFill.style.width = percentComplete + '%';
                    uploadPercentage.innerText = percentComplete + '%';
                    uploadMBs.innerText = `${loadedMB} MB / ${totalMB} MB`;
                }
            };

            xhr.onload = function() {
                setTimeout(() => progressContainer.style.display = 'none', 2000);
                
                try {
                    const response = JSON.parse(xhr.responseText);
                    if (xhr.status === 200 && response.success) {
                        uploadStatus.innerText = 'اكتمل الرفع بنجاح!';
                        showMessage('uploadMessage', '✅ تم رفع الملف بنجاح!', true);
                        fileInput.value = '';
                        loadFiles();
                    } else {
                        showMessage('uploadMessage', '❌ خطأ: ' + (response.error || 'فشل الرفع'), false);
                    }
                } catch (err) {
                    showMessage('uploadMessage', '❌ خطأ في السيرفر', false);
                }
            };

            xhr.onerror = function() {
                progressContainer.style.display = 'none';
                showMessage('uploadMessage', '❌ فشل الاتصال بالسيرفر. تأكد من عمل السيرفر.', false);
            };

            xhr.send(formData);
        }

        async function loadFiles() {
            const listDiv = document.getElementById('filesList');
            try {
                const response = await fetch(`${SERVER_URL}/api/files`);
                const data = await response.json();
                
                if (data.success) {
                    if(data.files.length === 0) {
                        listDiv.innerHTML = '<p style="text-align: center; color: var(--text-light);">لا توجد ملفات مرفوعة حالياً.</p>';
                        return;
                    }

                    listDiv.innerHTML = data.files.map(file => `
                        <div class="file-item">
                            <div class="file-info">
                                <div class="file-name">${file.filename}</div>
                                <div class="file-meta">الحجم: ${file.size}</div>
                                
                                <select id="lang-${file.filename}" style="margin-top: 10px; padding: 6px; font-size: 13px;">
                                    <option value="اللغة العربية الفصحى">العربية (فصحى)</option>
                                    <option value="اللهجة اليمنية الدارجة" selected>العربية (اللهجة اليمنية)</option>
                                    <option value="اللهجة المصرية">العربية (المصرية)</option>
                                    <option value="اللهجة الخليجية">العربية (الخليجية)</option>
                                    <option value="اللغة الإنجليزية (English)">الإنجليزية (English)</option>
                                </select>
                            </div>
                            <div class="file-actions">
                                <button class="btn-small btn-green" onclick="transcribeFile('${file.filename}')" id="btn-trans-${file.filename}">تفريغ 🤖</button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                listDiv.innerHTML = '<p style="color: red; text-align: center;">خطأ في الاتصال بالسيرفر لجلب الملفات.</p>';
            }
        }

        async function transcribeFile(filename) {
            const btn = document.getElementById(`btn-trans-${filename}`);
            const lang = document.getElementById(`lang-${filename}`).value;
            const resultBox = document.getElementById('transcriptionResult');
            
            btn.innerText = 'جاري التفريغ...';
            btn.disabled = true;
            resultBox.style.display = 'none';

            try {
                const response = await fetch(`${SERVER_URL}/api/transcribe`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename: filename, language: lang })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const text = data.text;
                    resultBox.innerHTML = `
                        <h4 style="margin-top:0; color: var(--primary);">نتيجة التفريغ:</h4>
                        <div>${text}</div>
                        <div style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
                            <button class="btn-small" onclick="exportFile('${encodeURIComponent(text)}', 'txt')">تصدير Text 📄</button>
                            <button class="btn-small" style="background: #2563eb;" onclick="exportFile('${encodeURIComponent(text)}', 'doc')">تصدير Word 📝</button>
                            <button class="btn-small" style="background: #dc2626;" onclick="exportPDF('${encodeURIComponent(text)}')">تصدير PDF 📑</button>
                        </div>
                    `;
                    resultBox.style.display = 'block';
                    resultBox.scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert('خطأ في التفريغ: ' + data.error);
                }
            } catch (err) {
                alert('خطأ في الاتصال أثناء التفريغ.');
            } finally {
                btn.innerText = 'تفريغ 🤖';
                btn.disabled = false;
            }
        }

        // دالة التصدير النصي و Word
        function exportFile(encodedText, type) {
            const text = decodeURIComponent(encodedText);
            let blob, filename;

            if (type === 'txt') {
                blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                filename = 'Transcription.txt';
            } else if (type === 'doc') {
                const htmlContent = `
                    <html dir="rtl"><head><meta charset="utf-8"></head>
                    <body style="font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6;">
                        ${text.replace(/\n/g, '<br>')}
                    </body></html>
                `;
                blob = new Blob(['\ufeff', htmlContent], { type: 'application/msword' });
                filename = 'Transcription.doc';
            }

            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }

        // دالة تصدير ملف PDF مباشرة من المتصفح
        function exportPDF(encodedText) {
            const text = decodeURIComponent(encodedText);
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // استخدام تنسيق يدعم النصوص العربية أو يعالجها بشكل سليم
            doc.setFont("helvetica"); // أو خط افتراضي
            doc.setFontSize(14);
            
            // تقسيم النص الطويل لأسطر تتناسب مع عرض صفحة الـ PDF
            const splitText = doc.splitTextToSize(text, 180);
            
            doc.text(splitText, 15, 20);
            doc.save("Transcription.pdf");
        }
    </script>
</body>
</html>
