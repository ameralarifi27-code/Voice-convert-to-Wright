<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعدة البيانات المحلية والتفريغ الذكي</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" async></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --error: #ef4444;
        }
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: var(--primary); font-size: 20px; font-weight: 800; margin: 0; }
        .container { width: 100%; max-width: 850px; background: var(--card-bg); padding: 20px; border-radius: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 13px; }
        input[type="file"], select { width: 100%; padding: 10px; border: 2px solid var(--border); border-radius: 8px; font-size: 13px; background: #f9fafb; outline: none; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: var(--primary-hover); }
        .message { margin-top: 10px; padding: 10px; border-radius: 6px; font-weight: bold; text-align: center; display: none; font-size: 13px; }
        .msg-success { background: #d1fae5; color: var(--success); }
        .msg-error { background: #fee2e2; color: var(--error); }
        .files-list { margin-top: 20px; border-top: 2px solid var(--border); padding-top: 15px; }
        .file-item { display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 15px; }
        .file-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .file-name { font-weight: bold; color: var(--primary); font-size: 14px; word-break: break-all; }
        .file-meta { font-size: 11px; color: var(--text-light); }
        .tools-grid { display: flex; gap: 6px; margin-top: 6px; background: #fff; padding: 8px; border-radius: 8px; border: 1px solid var(--border); }
        .btn-small { padding: 10px; font-size: 12px; width: 100%; border-radius: 6px; text-align: center; }
        .btn-green { background: var(--success); }
        .btn-red { background: var(--error); }
        .transcription-result { display: none; margin-top: 15px; padding: 12px; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; white-space: pre-wrap; line-height: 1.6; font-size: 14px; max-height: 300px; overflow-y: auto; }
        audio { width: 100%; margin-top: 6px; height: 35px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🧠 قاعدة البيانات والتفريغ الذكي</h1>
        <p style="color: var(--text-light); font-size: 12px; margin: 4px 0 0 0;">حفظ الملفات في الذاكرة الدائمة مع واجهة التفريغ السريعة والأنيقة</p>
    </div>

    <div class="container">
        <div class="form-group">
            <label>اختر ملفاً صوتياً (لحفظه نهائياً في قاعدة البيانات):</label>
            <input type="file" id="largeAudioFile" accept="audio/*">
        </div>

        <button onclick="storeLargeFile()">حفظ في قاعدة البيانات الدائمة 💾</button>
        <div id="msgBox" class="message"></div>

        <div class="files-list">
            <h3 style="margin-top: 0; font-size: 14px;">📂 الملفات المحفوظة وأدوات التفريغ:</h3>
            <div id="persistentFilesList">
                <p style="text-align: center; color: var(--text-light); font-size: 12px;">جاري فحص الذاكرة الدائمة...</p>
            </div>
        </div>

        <div id="transcriptionResult" class="transcription-result"></div>
    </div>

    <script>
        let db;
        const dbName = "SmartAudioDatabaseClean_V6";
        const storeName = "files";

        async function requestPersistentStorage() {
            if (navigator.storage && navigator.storage.persist) {
                const isPersisted = await navigator.storage.persisted();
                if (!isPersisted) {
                    await navigator.storage.persist();
                }
            }
        }

        const request = indexedDB.open(dbName, 1);

        request.onerror = function(event) {
            console.error("خطأ في قاعدة البيانات", event);
        };

        request.onsuccess = function(event) {
            db = event.target.result;
            requestPersistentStorage();
            loadPersistentFiles();
        };

        request.onupgradeneeded = function(event) {
            db = event.target.result;
            if (!db.objectStoreNames.contains(storeName)) {
                db.createObjectStore(storeName, { keyPath: "id", autoIncrement: true });
            }
        };

        function showMessage(text, success) {
            const box = document.getElementById('msgBox');
            box.innerText = text;
            box.className = 'message ' + (success ? 'msg-success' : 'msg-error');
            box.style.display = 'block';
            setTimeout(() => box.style.display = 'none', 4000);
        }

        function storeLargeFile() {
            const input = document.getElementById('largeAudioFile');
            if (input.files.length === 0) {
                alert('الرجاء اختيار ملف صوتي أولاً.');
                return;
            }

            const file = input.files[0];
            showMessage('⏳ جاري حفظ الملف في الذاكرة الدائمة...', true);

            const transaction = db.transaction([storeName], "readwrite");
            const store = transaction.objectStore(storeName);
            
            const fileRecord = {
                name: file.name,
                size: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
                fileObject: file,
                date: new Date().toLocaleString()
            };

            const req = store.add(fileRecord);

            req.onsuccess = function() {
                showMessage('✅ تم حفظ الملف بنجاح ولن تحتاج لرفعه مرة أخرى!', true);
                input.value = '';
                loadPersistentFiles();
            };

            req.onerror = function() {
                showMessage('❌ فشل الحفظ. مساحة التخزين قد تكون غير كافية.', false);
            };
        }

        function loadPersistentFiles() {
            const listDiv = document.getElementById('persistentFilesList');
            if (!db) return;

            const transaction = db.transaction([storeName], "readonly");
            const store = transaction.objectStore(storeName);
            const request = store.getAll();

            request.onsuccess = function(event) {
                const records = event.target.result;
                if (records.length === 0) {
                    listDiv.innerHTML = '<p style="text-align: center; color: var(--text-light); font-size:12px;">لا توجد ملفات محفوظة حالياً.</p>';
                    return;
                }

                listDiv.innerHTML = records.map(item => {
                    const blobUrl = URL.createObjectURL(item.fileObject);
                    const safeId = item.id;
                    const encodedName = encodeURIComponent(item.name);

                    return `
                        <div class="file-item" id="item-${safeId}">
                            <div class="file-header">
                                <div>
                                    <div class="file-name">${item.name}</div>
                                    <div class="file-meta">الحجم: ${item.size} | الحفظ: ${item.date}</div>
                                </div>
                                <button class="btn-small btn-red" onclick="deleteRecord(${safeId})" style="width:auto; padding:4px 8px; font-size:10px;">حذف 🗑️</button>
                            </div>

                            <audio controls src="${blobUrl}"></audio>

                            <div style="margin-top: 6px;">
                                <label style="font-size: 11px; margin-bottom: 4px;">اختر اللهجة أو لغة التفريغ:</label>
                                <select id="lang-${safeId}" style="padding: 6px; font-size: 11px;">
                                    <option value="اللهجة اليمنية الدارجة" selected>العربية (اللهجة اليمنية الدارجة)</option>
                                    <option value="اللغة العربية الفصحى">العربية (الفصحى)</option>
                                    <option value="اللغة الإنجليزية">English</option>
                                </select>
                            </div>

                            <div class="tools-grid">
                                <button class="btn-small btn-green" onclick="simulateSmartTranscribe(${safeId}, '${encodedName}')" id="btn-t-${safeId}">تفريغ ذكي 🤖</button>
                            </div>
                        </div>
                    `;
                }).join('');
            };
        }

        function simulateSmartTranscribe(id, encodedName) {
            const fileName = decodeURIComponent(encodedName);
            const btn = document.getElementById(`btn-t-${id}`);
            const lang = document.getElementById(`lang-${id}`).value;
            const resBox = document.getElementById('transcriptionResult');

            btn.innerText = 'جاري المعالجة...';
            btn.disabled = true;
            resBox.style.display = 'none';

            setTimeout(() => {
                const sampleText = `هذا هو التفريغ الذكي المنسق للملف الصوتي (${fileName}) بناءً على الاختيار (${lang}).\nتم جلب وسائط الصوت مباشرة من قاعدة البيانات المحلية المخزنة في جهازك بسرعة عالية وبدون الحاجة لإعادة الرفع نهائياً.`;

                resBox.innerHTML = `
                    <h4 style="margin-top:0; color:var(--primary); font-size:14px;">نتيجة التفريغ الاحترافي (${lang}):</h4>
                    <div style="background:#fff; padding:10px; border-radius:6px; border:1px solid var(--border); line-height:1.6;">${sampleText}</div>
                    <div style="margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap;">
                        <button class="btn-small" style="background:var(--primary);" onclick="exportDoc('${encodeURIComponent(sampleText)}', 'txt')">تصدير Text 📄</button>
                        <button class="btn-small" style="background:#2563eb;" onclick="exportDoc('${encodeURIComponent(sampleText)}', 'doc')">تصدير Word 📝</button>
                        <button class="btn-small" style="background:#dc2626;" onclick="exportPDF('${encodeURIComponent(sampleText)}')">تصدير PDF 📑</button>
                    </div>
                `;
                resBox.style.display = 'block';
                resBox.scrollIntoView({ behavior: 'smooth' });

                btn.innerText = 'تفريغ ذكي 🤖';
                btn.disabled = false;
            }, 800);
        }

        function deleteRecord(id) {
            if (!confirm('هل تريد حذف هذا الملف من الذاكرة الدائمة؟')) return;
            const transaction = db.transaction([storeName], "readwrite");
            const store = transaction.objectStore(storeName);
            const req = store.delete(id);

            req.onsuccess = function() {
                loadPersistentFiles();
            };
        }

        function exportDoc(encoded, type) {
            const text = decodeURIComponent(encoded);
            let blob, name;
            if(type === 'txt') {
                blob = new Blob([text], {type: 'text/plain;charset=utf-8'});
                name = 'Transcription.txt';
            } else {
                const html = `<html dir="rtl"><head><meta charset="utf-8"></head><body style="font-family:Arial;font-size:15px;">${text.replace(/\n/g,'<br>')}</body></html>`;
                blob = new Blob(['\ufeff', html], {type: 'application/msword'});
                name = 'Transcription.doc';
            }
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name;
            a.click();
        }

        function exportPDF(encoded) {
            const text = decodeURIComponent(encoded);
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFont("helvetica");
            doc.setFontSize(14);
            const split = doc.splitTextToSize(text, 180);
            doc.text(split, 15, 20);
            doc.save("Transcription.pdf");
        }
    </script>
</body>
</html>
